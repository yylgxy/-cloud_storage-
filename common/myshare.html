<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Storage - 我的分享</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; background:linear-gradient(135deg,#0a0a1a,#1a0a2e,#0a1628,#001a1a); color:#fff; }
.wrap { max-width:1200px; margin:0 auto; padding:32px 24px; }
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px; }
.header-left { display:flex; align-items:center; gap:14px; }
.header-left a { color:rgba(255,255,255,.35); text-decoration:none; font-size:16px; transition:color .3s; }
.header-left a:hover { color:#00d4ff; }
.header-left h1 { font-size:22px; font-weight:700; }
.user-badge { display:flex; align-items:center; gap:8px; padding:8px 16px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:14px; font-size:13px; }
.user-badge i { color:#00d4ff; }
.user-badge a { color:rgba(255,255,255,.5); text-decoration:none; margin-left:8px; }

.toolbar { display:flex; align-items:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border:none; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; transition:all .3s; color:#fff; text-decoration:none; }
.btn-primary { background:linear-gradient(135deg,#00d4ff,#7c3aed); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,212,255,.25); }
.btn-outline { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); color:#fff; }
.btn-outline:hover { background:rgba(255,255,255,.08); }
.btn-danger { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.2); color:#ef4444; }
.btn-danger:hover { background:rgba(239,68,68,.25); }
.btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
.btn-copy { background:rgba(0,212,255,.1); border:1px solid rgba(0,212,255,.2); color:#00d4ff; }
.btn-copy:hover { background:rgba(0,212,255,.2); }

.share-list { display:grid; gap:16px; }
.share-card { padding:20px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06); border-radius:16px; transition:all .3s; }
.share-card:hover { background:rgba(255,255,255,.04); }
.share-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.share-card-info { flex:1; }
.share-card-info .name { font-size:15px; font-weight:600; margin-bottom:4px; }
.share-card-info .url { font-size:12px; color:rgba(0,212,255,.5); word-break:break-all; margin-bottom:4px; cursor:pointer; }
.share-card-info .url:hover { color:#00d4ff; }
.share-card-info .meta { font-size:12px; color:rgba(255,255,255,.3); display:flex; gap:16px; flex-wrap:wrap; }
.share-card-info .meta span { display:inline-flex; align-items:center; gap:4px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:500; }
.tag-code { background:rgba(245,158,11,.15); color:#f59e0b; border:1px solid rgba(245,158,11,.2); }
.tag-no-code { background:rgba(255,255,255,.05); color:rgba(255,255,255,.3); border:1px solid rgba(255,255,255,.06); }
.tag-expired { background:rgba(239,68,68,.15); color:#ef4444; border:1px solid rgba(239,68,68,.2); }
.share-card-actions { display:flex; gap:6px; margin-top:12px; }

.empty-state { text-align:center; padding:80px 20px; }
.empty-state i { font-size:56px; color:rgba(255,255,255,.06); margin-bottom:16px; }
.empty-state h3 { color:rgba(255,255,255,.4); font-size:16px; font-weight:500; }
.empty-state p { color:rgba(255,255,255,.2); font-size:13px; margin-top:4px; }

.toast { position:fixed; top:24px; right:24px; padding:14px 20px; border-radius:12px; color:#fff; font-size:14px; font-weight:500; z-index:999; backdrop-filter:blur(20px); display:none; align-items:center; gap:10px; animation:slideIn .3s ease-out; border:1px solid rgba(255,255,255,.1); }
.toast.show { display:flex; }
.toast.success { background:rgba(16,185,129,.9); }
.toast.error { background:rgba(239,68,68,.9); }
.toast.info { background:rgba(59,130,246,.9); }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

@media (max-width:640px) { .share-card-top { flex-direction:column; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <a href="index.html"><i class="fas fa-arrow-left"></i></a>
      <h1>我的分享</h1>
    </div>
    <div class="user-badge">
      <i class="fas fa-user-circle"></i><span id="userName">-</span>
      <a href="index.html">首页</a>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="loadMyShares()"><i class="fas fa-rotate"></i> 刷新</button>
  </div>
  <div class="share-list" id="shareList">
    <div style="text-align:center;padding:40px;color:rgba(255,255,255,.3)"><i class="fas fa-spinner fa-spin" style="font-size:24px"></i><p style="margin-top:12px">加载中...</p></div>
  </div>
</div>

<script>
let token = localStorage.getItem('cloud_token');
if (!token) location.href='login.html';
let user = localStorage.getItem('cloud_user') || '';
document.getElementById('userName').textContent = user;

function showToast(msg, type) {
  let t = document.querySelector('.toast');
  if (!t) { t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.className='toast '+type+' show';
  t.innerHTML='<i class="fas fa-'+(type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle')+'"></i> '+msg;
  clearTimeout(t._hide); t._hide=setTimeout(()=>t.classList.remove('show'),3000);
}

function formatSize(bytes) {
  if (!bytes||bytes==0) return '--';
  const u=['B','KB','MB','GB']; let i=0; let s=Number(bytes);
  while(s>=1024&&i<u.length-1){s/=1024;i++;}
  return s.toFixed(i>0?1:0)+' '+u[i];
}

function escHtml(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadMyShares() {
  const el = document.getElementById('shareList');
  el.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,.3)"><i class="fas fa-spinner fa-spin" style="font-size:24px"></i><p style="margin-top:12px">加载中...</p></div>';
  try {
    const res = await fetch('/api/sharefiles?token='+encodeURIComponent(token)+'&cmd=list&page=1&size=999');
    const json = await res.json();
    if (json.code === 0 && json.data) {
      const myShares = json.data.filter(s => s.user_name === user);
      renderShares(myShares);
    } else {
      el.innerHTML = '<div class="empty-state"><i class="fas fa-share-nodes"></i><h3>暂无数据</h3><p>无法加载分享列表</p></div>';
    }
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#ef4444"></i><h3>加载失败</h3><p>'+e.message+'</p></div>';
  }
}

function renderShares(shares) {
  const el = document.getElementById('shareList');
  if (!shares || shares.length === 0) {
    el.innerHTML = '<div class="empty-state"><i class="fas fa-share-nodes"></i><h3>暂无分享</h3><p>在「我的文件」中分享文件后，会在这里显示</p></div>';
    return;
  }
  el.innerHTML = shares.map(s => {
    const hasCode = s.extract_code && s.extract_code.length > 0;
    const shareUrl = window.location.protocol+'//'+window.location.host+'/share?shareid='+encodeURIComponent(s.share_id);
    return `<div class="share-card">
      <div class="share-card-top">
        <div class="share-card-info">
          <div class="name"><i class="fas fa-file" style="color:rgba(255,255,255,.25);margin-right:8px"></i>${escHtml(s.file_name)}</div>
          <div class="url" onclick="copyText('${shareUrl}')">${shareUrl} <i class="fas fa-copy" style="font-size:10px;margin-left:4px"></i></div>
          <div class="meta">
            <span>${formatSize(s.file_size)}</span>
            <span><i class="fas fa-download" style="color:#00d4ff"></i> ${s.pv||0} 次下载</span>
            <span>${s.create_time||''}</span>
          </div>
        </div>
        <div>
          ${hasCode ? '<span class="tag tag-code"><i class="fas fa-lock"></i> 提取码</span>' : '<span class="tag tag-no-code">无需提取码</span>'}
          ${s.expire_time && s.expire_time !== '0000-00-00 00:00:00' ? '<span class="tag tag-code" style="margin-left:4px"><i class="fas fa-clock"></i> 有时效</span>' : ''}
        </div>
      </div>
      <div class="share-card-actions">
        <button class="btn btn-sm btn-copy" onclick="copyText('${shareUrl}')"><i class="fas fa-link"></i> 复制链接</button>
        ${hasCode ? `<button class="btn btn-sm btn-copy" onclick="copyText('${escHtml(s.extract_code)}')"><i class="fas fa-key"></i> 复制提取码</button>` : ''}
        <button class="btn btn-sm btn-danger" onclick="cancelShare('${escHtml(s.share_id)}')"><i class="fas fa-xmark"></i> 取消分享</button>
      </div>
    </div>`;
  }).join('');
}

async function cancelShare(shareId) {
  if (!confirm('确定取消该分享吗？')) return;
  try {
    const res = await fetch('/api/dealsharefile?token='+encodeURIComponent(token)+'&share_id='+encodeURIComponent(shareId)+'&cmd=cancel');
    const json = await res.json();
    if (json.code === 0) {
      showToast('取消分享成功','success');
      loadMyShares();
    } else {
      showToast(json.msg||'取消失败','error');
    }
  } catch(e) { showToast('网络错误','error'); }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板','success')).catch(() => showToast('复制失败','error'));
}

loadMyShares();
</script>
</body>
</html>
